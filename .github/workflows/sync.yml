name: Sync blogs -> dashboard
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - env:
          GA_SA_JSON: ${{ secrets.GA_SA_JSON }}
          FB_SA_JSON: ${{ secrets.FB_SA_JSON }}
          G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
          G_CLIENT_SECRET: ${{ secrets.G_CLIENT_SECRET }}
          G_REFRESH_TOTAL: ${{ secrets.G_REFRESH_TOTAL }}
        run: node sync.js
